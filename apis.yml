name: Filament
description: 'Filament (Filament Finance) is a hybrid on-chain perpetual / derivatives
  DEX built on the Sei Network. It pairs an off-chain orderbook with a Compartment-Based
  (COMB) liquidity pool to deliver deep liquidity even in thin markets, offering up to
  30x leverage on crypto perpetuals using USDC collateral and oracle-based mark prices.
  Filament Pro is the flagship trading platform, and the project exposes a signature-authenticated
  REST + WebSocket order-book API at orderbook.filament.finance for market makers and
  programmatic traders. The team draws on experience from Goldman Sachs, BlackRock,
  Persistence, and Nethermind; the protocol''s smart contracts were audited by PeckShield.
  Added to the API Evangelist network as a portfolio-lead stub and enriched from the
  provider''s public documentation.'
