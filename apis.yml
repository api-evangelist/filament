apis:
- name: Filament API
  description: 'Signature-authenticated REST + WebSocket order-book API for the Filament
    perpetual DEX on Sei. Place limit/market orders, cancel orders, manage isolated
    collateral, set TP/SL, read tradable assets with mark/spot/funding, and stream
    order-book state and order updates over WebSocket. Orders are authenticated by
    signing the order id with an ethers.js wallet (no API keys).'
